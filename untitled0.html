<!DOCTYPE html>
<html lang="en">
<head>

                case "replit":
                    displayText = "Replit User: SOPHIAMARSTELLE";

                case "githubEmail":
                    displayText = "GitHub Email: sophiamars24@gmail.com";

                case "githubUser":

                    break;
                default:
                    displayText = "";

            document.getElementById("display").innerText = displayText;
        }

</body>
</html>
